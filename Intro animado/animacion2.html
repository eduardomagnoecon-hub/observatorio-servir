<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Intro Observatorio – WebGL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }
    html,body{
      width:100%;
      height:100%;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#000;
      color:#fff;
      overflow:hidden; /* se habilita después de la intro */
    }

    /* Fondo de grilla tipo data-center */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size:48px 48px;
      opacity:.18;
      pointer-events:none;
      z-index:-1;
    }

    canvas#bg{
      position:fixed;
      inset:0;
      display:block;
      z-index:1;
    }

    /* CONTENIDO REAL (después de la intro) */
    #main-content{
      position:relative;
      z-index:2;
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:32px;
      opacity:0;
      pointer-events:none;
      transition:opacity 1.2s ease-in-out;
      background:radial-gradient(circle at top, #111 0, #000 55%);
    }
    #main-content.show{
      opacity:1;
      pointer-events:auto;
    }

    #logo-final{
      display:block;
      width:min(260px, 60vw);
      margin:0 auto 24px auto;
      filter:drop-shadow(0 22px 40px rgba(0,0,0,.65));
      transition:transform .4s ease, filter .4s ease;
    }
    #logo-link{
      display:inline-block;
    }
    #logo-link:hover #logo-final{
      transform:translateY(-4px) scale(1.03);
      filter:drop-shadow(0 28px 55px rgba(0,0,0,.9));
    }

    #main-content h1{
      font-size:clamp(26px,4vw,40px);
      margin-bottom:12px;
    }
    #main-content p{
      max-width:720px;
      color:#d0d0d0;
      margin:0 auto;
    }

    .fade-out{
      opacity:0;
      transition:opacity 1s ease-in-out;
      pointer-events:none;
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- CONTENIDO REAL / DESTINO FINAL -->
<div id="main-content">
  <a id="logo-link" href="https://observatorio-servir.netlify.app/#inicio"
     target="_blank" rel="noopener">
    <!-- MISMO PNG DE TU LOGO -->
    <img id="logo-final" src="logo-observatorio.png"
         alt="Observatorio del Servicio Civil - Ir al sitio">
  </a>
  <h1>Observatorio del Servicio Civil</h1>
  <p>
    Haz clic en el isotipo para ir al dashboard gerencial del Observatorio.
    Puedes reemplazar este texto por tu página real, iframes de Power BI, u otro contenido.
  </p>
</div>

<!-- Three.js desde CDN -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
  // ============ CONFIGURACIÓN BÁSICA ============ //
  const canvas = document.getElementById('bg');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 1);

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
  );
  camera.position.set(0, 0, 45);

  const light = new THREE.DirectionalLight(0xffffff, 1.2);
  light.position.set(12, 20, 30);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 0.45));

  // ============ LOGO (PLANO CON TEXTURA PNG) ============ //
  const logoGroup = new THREE.Group();
  scene.add(logoGroup);

  const texLoader = new THREE.TextureLoader();
  texLoader.load("logo-observatorio.png", (texture) => {
    const geo = new THREE.PlaneGeometry(22, 22);
    const mat = new THREE.MeshStandardMaterial({
      map: texture,
      transparent: true,
    });
    const logoMesh = new THREE.Mesh(geo, mat);
    logoMesh.position.set(0, 0, 0);
    logoMesh.castShadow = true;
    logoGroup.add(logoMesh);
  });

  // posición inicial del logo (lejos y pequeño)
  logoGroup.position.set(0, 0, -14);
  logoGroup.scale.set(0.18, 0.18, 0.18);

  // ============ “LLUVIA” DE TABLEROS / ESTADÍSTICAS ============ //
  const dashboardsGroup = new THREE.Group();
  scene.add(dashboardsGroup);

  const panelBaseMat = new THREE.MeshBasicMaterial({color:0x101319});
  const red1 = new THREE.Color(0xC41B3F);
  const red2 = new THREE.Color(0xE13B61);
  const accent = new THREE.Color(0xffffff);

  function createDashboardPanel(){
    const group = new THREE.Group();

    // panel base
    const panelGeo = new THREE.PlaneGeometry(2.4, 1.4);
    const panel = new THREE.Mesh(panelGeo, panelBaseMat.clone());
    group.add(panel);

    // barras / líneas dentro del panel (simulación de estadísticas)
    const barsCount = 4 + Math.floor(Math.random()*3); // 4 a 6
    for(let i=0; i<barsCount; i++){
      const width = 0.22;
      const height = 0.05 + Math.random()*0.45;
      const barGeo = new THREE.PlaneGeometry(width, height);
      const c = Math.random() < 0.5 ? red1 : red2;
      const mat = new THREE.MeshBasicMaterial({
        color: c.clone(),
        transparent:true,
        opacity:0.9
      });
      const bar = new THREE.Mesh(barGeo, mat);
      const xStart = -0.9;
      bar.position.set(xStart + i*0.42, -0.4 + height/2, 0.01);
      group.add(bar);
    }

    // línea superior tipo KPI
    const topGeo = new THREE.PlaneGeometry(1.6, 0.06);
    const topMat = new THREE.MeshBasicMaterial({
      color: accent,
      transparent:true,
      opacity:0.35
    });
    const top = new THREE.Mesh(topGeo, topMat);
    top.position.set(0, 0.55, 0.01);
    group.add(top);

    return group;
  }

  const NUM_PANELS = 160;
  for(let i=0; i<NUM_PANELS; i++){
    const p = createDashboardPanel();
    p.position.set(
      (Math.random() - 0.5) * 70,
      (Math.random() - 0.5) * 40,
      -80 - Math.random() * 120
    );
    dashboardsGroup.add(p);
  }

  // ============ ANIMACIÓN ============ //
  let start = performance.now();
  let finishedIntro = false;

  function animate(now){
    requestAnimationFrame(animate);
    const t = (now - start) / 1000; // segundos

    // Movimiento de dashboards: lluvia + acercamiento
    dashboardsGroup.children.forEach((panel) => {
      panel.position.z += 0.35;
      panel.position.y -= 0.02;
      if(panel.position.z > 30){
        panel.position.z = -180 - Math.random()*60;
        panel.position.x = (Math.random()-0.5)*70;
        panel.position.y = (Math.random()-0.5)*40;
      }
    });

    // Entrada elegante del logo
    if(t < 2.5){
      const k = Math.min(1, t/2.5);
      const s = 0.18 + k*0.82;        // escala de 0.18 a 1.0
      logoGroup.scale.set(s, s, s);
      logoGroup.position.z = -14 + k*7; // de -14 a -7
    }

    // Zoom cinematográfico hacia el logo + compresión de datos
    if(t >= 2.5 && t < 5){
      const k = (t-2.5)/2.5;  // 0..1
      camera.position.z = 45 - k*22;   // de 45 a 23
      dashboardsGroup.position.z = -k*18;
    }

    if(t >= 5 && !finishedIntro){
      finishedIntro = true;
      endIntro();
    }

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  // ============ FIN DE INTRO ============ //
  function endIntro(){
    const canvasEl = document.getElementById('bg');
    const main = document.getElementById('main-content');

    setTimeout(()=>{
      canvasEl.classList.add('fade-out');
      main.classList.add('show');
      document.body.style.overflow = "auto";
    }, 800);
  }

  // ============ RESPONSIVE ============ //
  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });
</script>

</body>
</html>
