<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Observatorio del Servicio Civil – Intro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ================== RESET ================== */
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{
      width:100%;
      height:100%;
      background:#000;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      overflow:hidden;
    }

    /* ================== FONDO GLOBAL ================== */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.08) 0, transparent 55%),
        radial-gradient(circle at bottom, rgba(196,27,63,0.3) 0, transparent 55%);
      mix-blend-mode:screen;
      opacity:.4;
      pointer-events:none;
      z-index:-2;
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size:48px 48px;
      opacity:.18;
      pointer-events:none;
      z-index:-1;
    }

    /* ================== CAPA INTRO ================== */
    #intro{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:10;
      background:radial-gradient(circle at top, #050509 0, #000 60%);
      transition:opacity 1.2s ease-in-out;
    }
    #intro.hidden{
      opacity:0;
      pointer-events:none;
    }

    /* CONTENEDOR 3D */
    .scanner-stage{
      position:relative;
      width:min(760px, 88vw);
      height:min(420px, 55vh);
      perspective:1200px;
    }

    .scanner-panel{
      position:absolute;
      inset:0;
      margin:auto;
      width:100%;
      height:100%;
      transform-style:preserve-3d;
      transform:
        rotateX(24deg)
        rotateY(-10deg)
        translateY(10px);
      transform-origin:center center;
      border-radius:32px;
      overflow:hidden;
      background:linear-gradient(145deg,#05050a,#141622);
      box-shadow:
        0 28px 70px rgba(0,0,0,.9),
        0 0 0 1px rgba(255,255,255,0.04);
    }

    /* REJILLA DE “MÓDULOS DE DATOS” */
    .scanner-grid{
      position:absolute;
      inset:11% 7%;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      grid-auto-rows:70px;
      gap:14px;
      transform:translateZ(40px);
    }

    .data-card{
      position:relative;
      border-radius:14px;
      background:linear-gradient(160deg,#12141d,#05060b);
      border:1px solid rgba(255,255,255,0.06);
      overflow:hidden;
      box-shadow:0 10px 24px rgba(0,0,0,.55);
      opacity:.6;
      transform:translateZ(0);
    }

    /* Cabecera tipo KPI */
    .data-card::before{
      content:"";
      position:absolute;
      left:10px;
      right:10px;
      top:10px;
      height:6px;
      border-radius:999px;
      background:linear-gradient(90deg,#C41B3F,#E13B61);
      opacity:.7;
    }

    /* “Gráfico” interno */
    .data-bars{
      position:absolute;
      left:10px;
      right:10px;
      bottom:10px;
      top:26px;
      display:flex;
      align-items:flex-end;
      gap:4px;
    }
    .data-bars span{
      flex:1;
      border-radius:4px 4px 2px 2px;
      background:#C41B3F;
      opacity:.85;
    }
    .data-bars span:nth-child(2){height:30%;}
    .data-bars span:nth-child(3){height:60%;}
    .data-bars span:nth-child(4){height:90%;}
    .data-bars span:nth-child(5){height:50%;}

    .data-card.alt .data-bars span{
      background:#E13B61;
    }

    /* Estado “iluminado” por el escáner */
    .data-card.scanned{
      opacity:1;
      box-shadow:
        0 0 18px rgba(255,255,255,.34),
        0 14px 40px rgba(196,27,63,.75);
      border-color:rgba(255,255,255,.5);
    }

    /* BARRA DE ESCANEO */
    .scan-line{
      position:absolute;
      left:0;
      right:0;
      margin:auto;
      width:120%;
      height:18%;
      background:linear-gradient(
        to bottom,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.25) 45%,
        rgba(196,27,63,0.55) 50%,
        rgba(255,255,255,0.25) 55%,
        rgba(255,255,255,0) 100%
      );
      mix-blend-mode:screen;
      transform:translateY(-25%);
      opacity:.0;
      pointer-events:none;
      animation:scan-move 4.5s ease-in-out forwards;
    }

    @keyframes scan-move{
      0%{
        transform:translateY(-25%);
        opacity:0;
      }
      10%{
        opacity:.9;
      }
      80%{
        transform:translateY(85%);
        opacity:.9;
      }
      100%{
        transform:translateY(110%);
        opacity:0;
      }
    }

    /* GLOW SUAVE EN EL PANEL AL ESCANEAR */
    .scanner-panel::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 10%, rgba(255,255,255,0.18) 0, transparent 55%),
        radial-gradient(circle at 50% 90%, rgba(196,27,63,0.35) 0, transparent 60%);
      mix-blend-mode:screen;
      opacity:0;
      animation:panel-glow 4.5s ease-in-out forwards;
    }
    @keyframes panel-glow{
      0%{opacity:0;}
      25%{opacity:.55;}
      75%{opacity:.4;}
      100%{opacity:0;}
    }

    /* TÍTULO FLOTANTE ARRIBA DEL PANEL */
    .scanner-title{
      position:absolute;
      left:0;right:0;
      top:-42px;
      text-align:center;
      font-size:14px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:#bbbbc4;
      opacity:.0;
      animation:title-in 1.4s ease-out forwards;
    }
    .scanner-subtitle{
      display:block;
      font-size:12px;
      opacity:.85;
      color:#888ea0;
      text-transform:none;
      letter-spacing:.05em;
      margin-top:4px;
    }
    @keyframes title-in{
      from{transform:translateY(8px);opacity:0;}
      to{transform:translateY(0);opacity:1;}
    }

    /* ================== CONTENIDO FINAL ================== */
    #main{
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:32px;
      z-index:1;
      opacity:0;
      pointer-events:none;
      transition:opacity 1.2s ease-in-out;
      background:radial-gradient(circle at top, #111 0, #000 55%);
    }
    #main.show{
      opacity:1;
      pointer-events:auto;
    }

    #logo-link{
      display:inline-block;
    }
    #logo-final{
      width:min(280px, 62vw);
      filter:drop-shadow(0 26px 48px rgba(0,0,0,.82));
      transition:transform .4s ease, filter .4s ease;
    }
    #logo-link:hover #logo-final{
      transform:translateY(-3px) scale(1.03);
      filter:drop-shadow(0 34px 70px rgba(0,0,0,.95));
    }

    #main h1{
      margin-top:18px;
      color:#ffffff;
      font-size:clamp(26px,4vw,40px);
      letter-spacing:.04em;
    }
    #main p{
      margin-top:8px;
      max-width:720px;
      color:#d0d0d0;
      font-size:clamp(14px,2.4vw,17px);
    }

    /* BOTÓN OPCIONAL (por si luego lo quieres usar) */
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:20px;
      padding:10px 22px;
      border-radius:999px;
      border:none;
      background:linear-gradient(135deg,#C41B3F,#E13B61);
      color:#fff;
      font-size:14px;
      letter-spacing:.08em;
      text-transform:uppercase;
      cursor:pointer;
      box-shadow:0 12px 28px rgba(196,27,63,.7);
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 18px 40px rgba(196,27,63,.9);
    }

    /* DESACTIVAR SCROLL DURANTE INTRO */
    .no-scroll{
      overflow:hidden;
    }

    @media(max-width:640px){
      .scanner-stage{
        height:52vh;
      }
      .scanner-grid{
        grid-auto-rows:60px;
      }
    }
  </style>
</head>
<body class="no-scroll">

<!-- ============ CAPA INTRO (SCANNER) ============ -->
<div id="intro">
  <div class="scanner-stage">
    <div class="scanner-title">
      ESCANEO DE INDICADORES DEL SERVICIO CIVIL
      <span class="scanner-subtitle">Integración de datos nacionales, regionales y locales</span>
    </div>

    <div class="scanner-panel">
      <!-- grilla de módulos de datos -->
      <div class="scanner-grid" id="grid">
        <!-- Las tarjetas se generan desde JS -->
      </div>

      <!-- barra de escaneo -->
      <div class="scan-line"></div>
    </div>
  </div>
</div>

<!-- ============ CONTENIDO FINAL (LOGO + LINK) ============ -->
<div id="main">
  <a id="logo-link" href="https://observatorio-servir.netlify.app/#inicio" target="_blank" rel="noopener">
    <!-- Usa aquí tu isotipo en PNG -->
    <img id="logo-final" src="logo-observatorio.png" alt="Observatorio del Servicio Civil">
  </a>
  <h1>Observatorio del Servicio Civil</h1>
  <p>
    Plataforma de indicadores para la alta dirección del Estado.  
    Haz clic en el isotipo para ir al dashboard gerencial del Observatorio.
  </p>
  <!-- Si quieres, puedes activar el botón en lugar de solo el logo:
  <button class="btn" onclick="location.href='https://observatorio-servir.netlify.app/#inicio'">
    INGRESAR AL OBSERVATORIO
  </button>
  -->
</div>

<script>
  // ======== GENERAR TARJETAS DE DATOS (MÓDULOS) ========
  const grid = document.getElementById('grid');

  const rows = 3;   // filas visibles
  const cols = 5;   // columnas
  const total = rows * cols;

  for(let i = 0; i < total; i++){
    const card = document.createElement('div');
    card.className = 'data-card';
    if(i % 3 === 0) card.classList.add('alt');

    const bars = document.createElement('div');
    bars.className = 'data-bars';

    // crear 5 barras simuladas
    for(let b = 0; b < 5; b++){
      const span = document.createElement('span');
      const base = 20 + Math.random() * 70; // altura aleatoria
      span.style.height = base + '%';
      bars.appendChild(span);
    }

    card.appendChild(bars);
    grid.appendChild(card);
  }

  // ======== SIMULAR EFECTO DE ESCANEO (ILUMINAR TARJETAS) ========
  const cards = Array.from(document.querySelectorAll('.data-card'));

  function animateScan(){
    // recorrer las tarjetas de arriba hacia abajo, de izquierda a derecha
    cards.forEach((card, index)=>{
      const delay = 250 + index * 90; // ms
      setTimeout(()=>{
        card.classList.add('scanned');
      }, delay);

      // luego les baja el brillo otra vez
      setTimeout(()=>{
        card.classList.remove('scanned');
      }, delay + 1600);
    });
  }

  // Iniciar animación de escaneo un poco después de cargar
  window.addEventListener('load', () => {
    animateScan();

    // Después de ~5.5s, terminar la intro y mostrar contenido
    setTimeout(() => {
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('main').classList.add('show');
      document.body.classList.remove('no-scroll');
    }, 5600);
  });
</script>

</body>
</html>
