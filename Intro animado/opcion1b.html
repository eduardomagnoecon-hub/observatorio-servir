<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Observatorio del Servicio Civil – Intro Scanner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  /* ============ RESET ============ */
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:#000;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;
  }

  /* ============ INTRO ============ */
  #intro{
    position:fixed;
    inset:0;
    background:#020308;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    transition:opacity 1.1s ease-in-out;
  }
  #intro.hidden{
    opacity:0;
    pointer-events:none;
  }

  /* fondo tipo “tech grid” */
  #intro::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:48px 48px;
    opacity:.16;
    pointer-events:none;
  }

  .scene{
    position:relative;
    width:min(520px,90vw);
    height:min(520px,90vw);
  }

  /* halo central */
  .halo{
    position:absolute;
    inset:10%;
    border-radius:50%;
    background:
      radial-gradient(circle at 30% 10%, rgba(255,255,255,.16) 0, transparent 45%),
      radial-gradient(circle at 70% 90%, rgba(196,27,63,.3) 0, transparent 55%),
      radial-gradient(circle, #111827 0, #020308 70%);
    filter:blur(1px);
  }

  /* capas / paneles de datos */
  .layers{
    position:absolute;
    inset:17%;
    display:flex;
    align-items:center;
    justify-content:center;
    filter:drop-shadow(0 30px 60px rgba(0,0,0,.9));
  }
  .layer{
    position:absolute;
    width:78%;
    height:26%;
    border-radius:18px;
    background:linear-gradient(135deg,#101322,#050814);
    border:1px solid rgba(255,255,255,.08);
    overflow:hidden;
    opacity:0;
    transform:translateY(40px) scale(.9);
    transition:
      opacity .9s ease-out,
      transform .9s cubic-bezier(.19,1,.22,1);
  }
  .layer:nth-child(1){top:14%;}
  .layer:nth-child(2){top:38%;}
  .layer:nth-child(3){top:62%;}

  .layer.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  /* contenido simulado de cada panel (mini dashboards) */
  .layer-inner{
    position:absolute;
    inset:14%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
  }
  .kpi{
    border-radius:10px;
    background:linear-gradient(145deg,#151827,#050814);
    border:1px solid rgba(255,255,255,.06);
    position:relative;
    overflow:hidden;
  }
  .kpi::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(120deg,rgba(196,27,63,.7),transparent 55%),
      radial-gradient(circle at 0% 0%,rgba(255,255,255,.16),transparent 50%);
    opacity:.35;
    mix-blend-mode:screen;
  }
  .bars{
    position:absolute;
    inset:45% 10% 12% 10%;
    display:flex;
    align-items:flex-end;
    gap:3px;
  }
  .bars span{
    flex:1;
    border-radius:6px 6px 2px 2px;
    background:#C41B3F;
    opacity:.85;
  }
  .bars span:nth-child(2){height:70%;}
  .bars span:nth-child(3){height:40%;}
  .bars span:nth-child(4){height:95%;}
  .bars span:nth-child(5){height:55%;}
  .kpi:nth-child(3n+1) .bars span{background:#E13B61;}
  .kpi:nth-child(4n+2) .bars span{background:#F97373;}

  .top-line{
    position:absolute;
    left:10%;right:18%;top:18%;
    height:5px;
    border-radius:999px;
    background:linear-gradient(90deg,#ffffffaa,#ffffff33);
  }

  /* línea de escaneo */
  .scan-line{
    position:absolute;
    left:12%;right:12%;
    height:4px;
    border-radius:999px;
    background:linear-gradient(90deg,transparent,#ffffff,#ffffff,transparent);
    box-shadow:0 0 18px rgba(255,255,255,.9);
    opacity:0;
    filter:blur(0.2px);
  }
  .scan-line.scan{
    opacity:1;
    animation:scan-sweep 3.5s cubic-bezier(.19,1,.22,1) forwards;
  }

  @keyframes scan-sweep{
    0%  {top:10%;opacity:0;}
    5%  {opacity:1;}
    45% {top:74%;opacity:1;}
    70% {top:26%;opacity:.8;}
    100%{top:50%;opacity:0;}
  }

  /* logo central */
  .logo-core{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .logo-core img{
    width:56%;
    max-width:260px;
    filter:
      drop-shadow(0 18px 38px rgba(0,0,0,.9))
      drop-shadow(0 0 30px rgba(196,27,63,.75));
    opacity:0;
    transform:scale(.7);
    transition:
      opacity 1.4s ease-out,
      transform 1.4s cubic-bezier(.19,1,.22,1);
  }
  .logo-core.show img{
    opacity:1;
    transform:scale(1);
  }
  .logo-core.focus img{
    transform:scale(1.12);
    filter:
      drop-shadow(0 22px 55px rgba(0,0,0,.95))
      drop-shadow(0 0 45px rgba(225,59,97,.9));
    transition:transform 1.1s ease-out, filter 1.1s ease-out;
  }

  /* destellos laterales (detalle Apple) */
  .glow-left,
  .glow-right{
    position:absolute;
    width:32%;
    height:32%;
    border-radius:50%;
    filter:blur(22px);
    opacity:0;
    transition:opacity 1.2s ease-out 1.2s;
  }
  .glow-left{
    left:4%;top:18%;
    background:radial-gradient(circle,#C41B3F,transparent 60%);
  }
  .glow-right{
    right:2%;bottom:16%;
    background:radial-gradient(circle,#E13B61,transparent 60%);
  }
  .glow-on{
    opacity:.45;
  }

  /* ============ PANTALLA FINAL ============ */
  #main{
    position:relative;
    z-index:1;
    width:100%;height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 20px;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.2s ease-in-out;
    background:radial-gradient(circle at top,#111827 0,#020308 62%);
  }
  #main.show{
    opacity:1;
    pointer-events:auto;
  }

  #logo-link{
    display:inline-block;
  }
  #logo-final{
    width:min(260px,60vw);
    filter:drop-shadow(0 24px 44px rgba(0,0,0,.8));
    transition:transform .35s ease, filter .35s ease;
  }
  #logo-link:hover #logo-final{
    transform:translateY(-4px) scale(1.03);
    filter:drop-shadow(0 34px 70px rgba(0,0,0,1));
  }
  #main h1{
    color:#fff;
    font-size:clamp(26px,4vw,40px);
    margin-top:18px;
    letter-spacing:.04em;
  }
  #main p{
    color:#d4d4d4;
    max-width:720px;
    margin:10px auto 0;
    font-size:clamp(15px,2.4vw,18px);
  }
  .btn-go{
    margin-top:22px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 22px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.22);
    background:radial-gradient(circle at 0 0,#C41B3F 0,transparent 55%);
    color:#fff;
    text-decoration:none;
    font-size:15px;
    letter-spacing:.03em;
    text-transform:uppercase;
    cursor:pointer;
    transition:
      transform .2s ease,
      box-shadow .2s ease,
      background .2s ease,
      border-color .2s ease;
  }
  .btn-go span.icon{
    font-size:18px;
  }
  .btn-go:hover{
    transform:translateY(-1px);
    box-shadow:0 12px 30px rgba(0,0,0,.85);
    background:radial-gradient(circle at 0 0,#E13B61 0,transparent 60%);
    border-color:rgba(255,255,255,.4);
  }

  @media (max-width:480px){
    .layer-inner{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>

<!-- ============ INTRO SCANNER ============ -->
<div id="intro">
  <div class="scene">
    <div class="halo"></div>

    <div class="layers">
      <!-- Capa 1 -->
      <div class="layer" id="layer1">
        <div class="layer-inner">
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:35%"></span><span></span><span></span><span></span><span></span></div></div>
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:60%"></span><span></span><span></span><span></span><span></span></div></div>
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:20%"></span><span></span><span></span><span></span><span></span></div></div>
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:75%"></span><span></span><span></span><span></span><span></span></div></div>
        </div>
      </div>
      <!-- Capa 2 -->
      <div class="layer" id="layer2">
        <div class="layer-inner">
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:45%"></span><span></span><span></span><span></span><span></span></div></div>
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:80%"></span><span></span><span></span><span></span><span></span></div></div>
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:55%"></span><span></span><span></span><span></span><span></span></div></div>
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:30%"></span><span></span><span></span><span></span><span></span></div></div>
        </div>
      </div>
      <!-- Capa 3 -->
      <div class="layer" id="layer3">
        <div class="layer-inner">
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:65%"></span><span></span><span></span><span></span><span></span></div></div>
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:25%"></span><span></span><span></span><span></span><span></span></div></div>
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:90%"></span><span></span><span></span><span></span><span></span></div></div>
          <div class="kpi"><div class="top-line"></div><div class="bars"><span style="height:50%"></span><span></span><span></span><span></span><span></span></div></div>
        </div>
      </div>
    </div>

    <!-- línea de escaneo -->
    <div class="scan-line" id="scanLine"></div>

    <!-- logo central -->
    <div class="logo-core" id="logoCore">
      <!-- Usa tu logo aquí -->
      <img src="logo-observatorio.png" alt="Observatorio del Servicio Civil">
    </div>

    <!-- brillos laterales -->
    <div class="glow-left" id="glowLeft"></div>
    <div class="glow-right" id="glowRight"></div>
  </div>
</div>

<!-- ============ PANTALLA FINAL / ENLACE ============ -->
<div id="main">
  <a id="logo-link" href="https://observatorio-servir.netlify.app/#inicio" target="_blank" rel="noopener">
    <img id="logo-final" src="logo-observatorio.png" alt="Ir al Observatorio del Servicio Civil">
  </a>
  <h1>Observatorio del Servicio Civil</h1>
  <p>
    Haz clic en el isotipo para ingresar al dashboard gerencial del Observatorio.
  </p>
  <a class="btn-go" href="https://observatorio-servir.netlify.app/#inicio" target="_blank" rel="noopener">
    <span class="icon">➜</span> Ir al Observatorio
  </a>
</div>

<script>
  window.addEventListener("load", () => {
    const layer1 = document.getElementById("layer1");
    const layer2 = document.getElementById("layer2");
    const layer3 = document.getElementById("layer3");
    const logoCore = document.getElementById("logoCore");
    const scanLine = document.getElementById("scanLine");
    const glowLeft = document.getElementById("glowLeft");
    const glowRight = document.getElementById("glowRight");
    const intro = document.getElementById("intro");
    const main = document.getElementById("main");

    // 1) Aparecen las capas de datos, como paneles de información
    setTimeout(() => { layer1.classList.add("show"); }, 400);
    setTimeout(() => { layer2.classList.add("show"); }, 900);
    setTimeout(() => { layer3.classList.add("show"); }, 1350);

    // 2) Aparece el logo central estilo Apple
    setTimeout(() => {
      logoCore.classList.add("show");
      glowLeft.classList.add("glow-on");
      glowRight.classList.add("glow-on");
    }, 1600);

    // 3) Activa la línea de escaneo
    setTimeout(() => {
      scanLine.classList.add("scan");
    }, 1900);

    // 4) Foco final en el logo (como si el scanner lo resaltara)
    setTimeout(() => {
      logoCore.classList.add("focus");
    }, 3500);

    // 5) Transición a la pantalla final
    setTimeout(() => {
      intro.classList.add("hidden");
      main.classList.add("show");
      document.body.style.overflow = "auto";
    }, 5200); // puedes ajustar este tiempo
  });
</script>

</body>
</html>
