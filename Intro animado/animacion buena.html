<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL OBSERVATORIO - Intro Premium</title>
    <!-- Carga de Fuentes de Google: Open Sans (Institucional) y Montserrat (Modernidad) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;800&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/EasePack.min.js"></script>

    <style>
        body {
            background-color: #0F172A; /* Azul oscuro profundo (Slate-900) para contraste holográfico */
            overflow: hidden;
            font-family: 'Open Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            color: white;
        }

        #animation-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #main-svg {
            max-width: 90vw;
            max-height: 90vh;
            width: 800px;
            height: 500px;
            z-index: 10;
        }

        /* Fondo de malla tecnológica sutil */
        .tech-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(166, 28, 57, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            z-index: 0;
            opacity: 0.5;
        }

        .data-text {
            font-family: 'Montserrat', sans-serif;
            font-variant-numeric: tabular-nums;
        }

        .glow-effect {
            filter: drop-shadow(0 0 8px rgba(228, 58, 94, 0.6));
        }
        
        .blur-filter {
            filter: blur(4px);
        }
    </style>
</head>
<body>

    <div class="tech-bg"></div>

    <div id="animation-container">
        <svg id="main-svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
            
            <!-- DEFS: Gradientes y Mascaras -->
            <defs>
                <linearGradient id="grad-brand" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#981B36;stop-opacity:1" /> <!-- Rojo Institucional Oscuro -->
                    <stop offset="100%" style="stop-color:#E43A5E;stop-opacity:1" /> <!-- Rojo Brillante -->
                </linearGradient>
                
                <filter id="hologram-glow">
                    <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- FASE 1: Red de Datos (Data Network) -->
            <g id="network-group">
                <!-- Líneas de conexión generadas dinámicamente o estáticas -->
                <path id="network-lines" d="M100,250 L200,150 L300,250 L400,100 L500,300 L600,200 L700,250" 
                      fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
                
                <!-- Nube de puntos (Representando servidores civiles) -->
                <g id="dots-container">
                    <!-- Se llenará con JS para efecto orgánico -->
                </g>
            </g>

            <!-- FASE 2: El Escáner Holográfico -->
            <g id="scanner-group" opacity="0">
                <!-- Barra de escaneo -->
                <line x1="400" y1="50" x2="400" y2="450" stroke="url(#grad-brand)" stroke-width="2" id="scan-line" opacity="0.8">
                    <animate attributeName="stroke-opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" />
                </line>
                <!-- Datos que aparecen tras el escaneo -->
                <g id="scanned-data" opacity="0">
                    <rect x="250" y="150" width="300" height="200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
                    <!-- Gráficos flotantes tipo HUD -->
                    <rect x="270" y="280" width="40" height="0" fill="#981B36" class="bar-grow" data-height="60" opacity="0.8"/>
                    <rect x="320" y="280" width="40" height="0" fill="#E43A5E" class="bar-grow" data-height="100" opacity="0.8"/>
                    <rect x="370" y="280" width="40" height="0" fill="#981B36" class="bar-grow" data-height="40" opacity="0.8"/>
                    <rect x="420" y="280" width="40" height="0" fill="#E43A5E" class="bar-grow" data-height="80" opacity="0.8"/>
                    
                    <!-- Texto de conteo rápido -->
                    <text x="400" y="200" text-anchor="middle" fill="#fff" font-size="32" font-weight="800" class="data-text" id="counter-text">0</text>
                    <text x="400" y="220" text-anchor="middle" fill="#aaa" font-size="12" font-weight="300" letter-spacing="2">SERVIDORES CIVILES</text>
                </g>
            </g>

            <!-- FASE 3: Convergencia a Logo -->
            <g id="logo-group" transform="translate(400, 250) scale(0)">
                <!-- El ícono de la Lupa "Q" (Reconstrucción estilizada del logo oficial) -->
                <circle cx="0" cy="-10" r="45" fill="none" stroke="#E43A5E" stroke-width="8" id="lens-circle" />
                <!-- Mango de la lupa -->
                <line x1="32" y1="22" x2="55" y2="45" stroke="#981B36" stroke-width="10" stroke-linecap="round" id="lens-handle" />
                <!-- Detalle interno (reflejo) -->
                <path d="M -25 -25 A 40 40 0 0 1 10 -40" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.4" />
                
                <!-- Texto Oficial -->
                <g id="brand-text" transform="translate(0, 80)" opacity="0">
                    <text x="0" y="0" text-anchor="middle" fill="#fff" font-family="'Montserrat', sans-serif" font-weight="800" font-size="24">OBSERVATORIO</text>
                    <text x="0" y="20" text-anchor="middle" fill="#E43A5E" font-family="'Open Sans', sans-serif" font-weight="600" font-size="14" letter-spacing="3">DEL SERVICIO CIVIL</text>
                </g>
            </g>
            
            <!-- Overlay Flash -->
            <rect id="flash-overlay" x="0" y="0" width="800" height="500" fill="white" opacity="0" pointer-events="none"/>

        </svg>
    </div>

    <script>
        // 1. GENERACIÓN DE PARTÍCULAS (Data Cloud)
        const dotsContainer = document.getElementById('dots-container');
        const svgNS = "http://www.w3.org/2000/svg";
        const totalDots = 40;
        
        // Crear puntos aleatorios alrededor del centro
        for(let i=0; i<totalDots; i++) {
            let circle = document.createElementNS(svgNS, "circle");
            // Distribución aleatoria pero concentrada
            let x = 400 + (Math.random() - 0.5) * 600;
            let y = 250 + (Math.random() - 0.5) * 400;
            let r = Math.random() * 2 + 1;
            
            circle.setAttribute("cx", x);
            circle.setAttribute("cy", y);
            circle.setAttribute("r", r);
            circle.setAttribute("fill", i % 2 === 0 ? "#E43A5E" : "#fff"); // Rojo y blanco
            circle.setAttribute("opacity", Math.random() * 0.5 + 0.1);
            circle.setAttribute("class", "data-dot");
            dotsContainer.appendChild(circle);
        }

        const tl = gsap.timeline({
            defaults: { ease: "power3.inOut" }
        });

        /* ============================
           SECUENCIA DE ANIMACIÓN
           ============================ */

        // FASE 1: ORGANIZACIÓN DE DATOS (2.5s)
        // Los puntos flotan y convergen
        tl.to(".data-dot", {
            duration: 2,
            attr: { cx: (i) => 400 + (Math.random() - 0.5) * 300, cy: (i) => 250 + (Math.random() - 0.5) * 200 }, // Se agrupan más
            opacity: 1,
            stagger: { amount: 1, from: "random" },
            ease: "elastic.out(1, 0.7)"
        }, "start");

        tl.from("#network-lines", {
            duration: 2,
            strokeDasharray: 1000,
            strokeDashoffset: 1000,
            opacity: 0,
            ease: "power2.inOut"
        }, "start+=0.5");

        // FASE 2: EL ESCANEO (ANÁLISIS) (1.5s)
        tl.add("scan");
        
        // La red y puntos se desvanecen un poco
        tl.to(["#network-lines", ".data-dot"], { opacity: 0.1, scale: 0.8, transformOrigin: "50% 50%", duration: 0.5 }, "scan");
        
        // Aparece el grupo del escáner
        tl.set("#scanner-group", { opacity: 1 }, "scan");
        
        // Línea de escaneo barre la pantalla
        tl.fromTo("#scan-line", 
            { attr: { x1: 200, x2: 200 }, opacity: 0 },
            { attr: { x1: 600, x2: 600 }, opacity: 1, duration: 1.5, ease: "power2.inOut" },
            "scan"
        );
        
        // Mientras pasa la línea, aparecen los datos (efecto reveal)
        tl.to("#scanned-data", { opacity: 1, duration: 0.5 }, "scan+=0.5");
        
        // Crecimiento de barras del gráfico
        tl.to(".bar-grow", {
            height: (i, target) => target.getAttribute("data-height"),
            y: (i, target) => 280 - target.getAttribute("data-height"),
            duration: 0.8,
            stagger: 0.1,
            ease: "back.out(1.7)"
        }, "scan+=0.6");
        
        // Contador numérico subiendo (Simulando el dato real)
        let counterObj = { val: 0 };
        tl.to(counterObj, {
            val: 1589246,
            duration: 1.5,
            ease: "power1.out",
            onUpdate: function() {
                // Formato de número con comas
                document.getElementById("counter-text").textContent = Math.floor(counterObj.val).toLocaleString();
            }
        }, "scan+=0.2");

        // FASE 3: CONVERGENCIA E IDENTIDAD (1.5s)
        tl.add("focus");

        // Todo colapsa hacia el centro dramáticamente
        tl.to(["#scanner-group", "#network-group"], {
            scale: 0,
            opacity: 0,
            transformOrigin: "50% 50%",
            duration: 0.8,
            ease: "back.in(2)"
        }, "focus");

        // Flash blanco sutil al momento del impacto
        tl.to("#flash-overlay", { opacity: 0.1, duration: 0.1, yoyo: true, repeat: 1 }, "focus+=0.7");

        // Explosión del Logo (Scale up elástico)
        tl.to("#logo-group", {
            scale: 1,
            duration: 1.2,
            ease: "elastic.out(1, 0.6)"
        }, "focus+=0.8");

        // Dibujo del círculo del logo (efecto draw)
        const circleLen = document.getElementById("lens-circle").getTotalLength();
        tl.fromTo("#lens-circle", 
            { strokeDasharray: circleLen, strokeDashoffset: circleLen },
            { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
            "focus+=0.8"
        );

        // Texto deslizando hacia abajo
        tl.to("#brand-text", {
            opacity: 1,
            y: 90, // Pequeño ajuste de posición final
            duration: 0.8,
            ease: "power2.out"
        }, "focus+=1.2");

    </script>
</body>
</html>
