<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL OBSERVATORIO - Intro Animada</title>
    <!-- Carga de Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&family=Cabin:wght@300&display=swap" rel="stylesheet">
    <!-- Carga de Tailwind CSS para estructura básica y utilidad -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carga de la librería GSAP (Core) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- Carga de EasePack para el efecto elástico del logo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/EasePack.min.js"></script>

    <style>
        /* Estilos generales según especificación */
        body {
            background-color: #000000; /* Fondo Negro Sólido */
            overflow: hidden; /* Evitar barras de desplazamiento durante la animación */
            font-family: 'Open Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            color: #E43A5E; /* Color principal del texto final */
        }

        /* Contenedor principal para centrar el SVG */
        #animation-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SVG Viewport para asegurar la escalabilidad */
        #main-svg {
            max-width: 90vw;
            max-height: 90vh;
            width: 600px; /* Tamaño base para diseño */
            height: 400px;
        }

        /* Estilo para el efecto de resplandor de la línea (Phase 1) */
        .glow-line {
            filter: drop-shadow(0 0 5px #C41B3F) drop-shadow(0 0 10px #C41B3F);
        }

        /* Estilo para el texto de descripción en la Fase 2 */
        .calibri-light {
            font-family: 'Cabin', sans-serif; /* Usamos Cabin Light (300) como alternativa a Calibri Light */
            font-weight: 300;
        }

    </style>
</head>
<body>

    <div id="animation-container">
        <svg id="main-svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet">
            <!--
                ELEMENTOS PARA LA ANIMACIÓN (FASES 1, 2 y 3)
                Se agrupan para facilitar la gestión del Timeline en GSAP
            -->

            <!-- Fase 1: Línea de Datos Brillante y Puntos -->
            <g id="phase1-group">
                <!-- La curva de escala estadística (Path) -->
                <!-- stroke-dasharray/DrawSVG se usará para animar el trazo -->
                <path id="data-line"
                      class="glow-line"
                      d="M50,300 C150,100 250,350 350,150 S450,50 550,250"
                      fill="none"
                      stroke="#C41B3F"
                      stroke-width="4"
                      stroke-linecap="round"
                      opacity="0"
                />

                <!-- Puntos de datos clave (inicialmente invisibles/pequeños) -->
                <g id="point-group" opacity="0">
                    <!-- Puntos a lo largo de la línea, revelados secuencialmente -->
                    <circle cx="50" cy="300" r="4" fill="#C41B3F" class="data-point" transform="scale(0)"/>
                    <circle cx="175" cy="180" r="4" fill="#C41B3F" class="data-point" transform="scale(0)"/>
                    <circle cx="300" cy="250" r="4" fill="#C41B3F" class="data-point" transform="scale(0)"/>
                    <circle cx="425" cy="100" r="4" fill="#C41B3F" class="data-point" transform="scale(0)"/>
                    <circle cx="550" cy="250" r="4" fill="#C41B3F" class="data-point" transform="scale(0)"/>
                </g>
            </g>


            <!-- Fase 2: Ensamblaje Rápido del Dashboard -->
            <g id="dashboard-group" transform="translate(300, 200)" opacity="0">
                <!-- Grupo de elementos centrado en 300, 200 para facilitar la animación de colapso -->

                <!-- Gráficos de Barras (Usando colores secundarios) -->
                <g id="dashboard-bars" transform="translate(-100, 50)">
                    <rect x="0" y="0" width="10" height="80" fill="#310710" transform="scale(1, 0)" />
                    <rect x="20" y="0" width="10" height="120" fill="#4E0B19" transform="scale(1, 0)" />
                    <rect x="40" y="0" width="10" height="90" fill="#6C0F23" transform="scale(1, 0)" />
                    <rect x="60" y="0" width="10" height="150" fill="#8A132C" transform="scale(1, 0)" />
                </g>

                <!-- KPI Box y Texto de ejemplo (Simulación de carga) -->
                <g id="dashboard-kpis" transform="translate(100, -100)" opacity="0">
                    <rect x="0" y="0" width="180" height="50" fill="#111111" stroke="#310710" stroke-width="1" rx="5"/>
                    <text x="10" y="20" fill="#C41B3F" font-size="12" class="calibri-light">KPI Principal:</text>
                    <text x="10" y="40" fill="#E43A5E" font-size="18" font-weight="bold">150.3M</text>
                </g>

                <!-- Anillo de progreso (simulado) -->
                <circle cx="-150" cy="-50" r="30" fill="none" stroke="#4E0B19" stroke-width="8" opacity="0.5"/>
                <path id="ring-progress"
                      d="M -150 -82 A 32 32 0 0 1 -118 -50"
                      fill="none"
                      stroke="#C41B3F"
                      stroke-width="8"
                      stroke-linecap="round"
                      opacity="0"
                />

                <!-- Texto de referencia para el dashboard -->
                 <text x="0" y="-180" text-anchor="middle" fill="#C41B3F" font-size="16" font-weight="bold" class="calibri-light" opacity="0">Cargando Análisis Ejecutivo...</text>

            </g>

            <!-- Fase 3: Icono y Texto del Logo Final -->
            <g id="logo-reveal-group" transform="translate(300, 200)">
                <!-- Ícono estilizado (Círculo dentro de un círculo) -->
                <g id="logo-icon" opacity="0">
                    <circle id="logo-icon-dark" cx="0" cy="0" r="40" fill="#90142E" transform="scale(0)"/>
                    <circle id="logo-icon-light" cx="0" cy="0" r="30" fill="#E43A5E" transform="scale(0)"/>
                    <!-- Simulación de un punto de observación en el centro -->
                    <circle id="logo-icon-center" cx="0" cy="0" r="5" fill="#000000" opacity="0"/>
                </g>

                <!-- Texto Final del Logo -->
                <text id="logo-text"
                      x="0" y="10"
                      text-anchor="middle"
                      font-family="'Open Sans', sans-serif"
                      font-weight="700"
                      font-size="40"
                      fill="#E43A5E"
                      opacity="0"
                      style="letter-spacing: 2px;"
                >
                    EL OBSERVATORIO
                </text>
            </g>

        </svg>
    </div>

    <script>
        // Referencias a los elementos
        const dataLine = document.getElementById('data-line');
        const pointGroup = document.getElementById('point-group');
        const dashboardGroup = document.getElementById('dashboard-group');
        const logoIconDark = document.getElementById('logo-icon-dark');
        const logoIconLight = document.getElementById('logo-icon-light');
        const logoIconCenter = document.getElementById('logo-icon-center');
        const logoText = document.getElementById('logo-text');
        const ringProgress = document.getElementById('ring-progress');

        /* PREPARACIÓN PARA ANIMACIÓN DE DIBUJO (Stroke Draw)
           Como no usamos DrawSVGPlugin (plugin pago), usamos la técnica nativa de JS:
           1. Obtenemos la longitud total del path (getTotalLength)
           2. Seteamos strokeDasharray a esa longitud.
           3. Seteamos strokeDashoffset a esa longitud (oculta el trazo).
           4. Animamos strokeDashoffset a 0 para "dibujar".
        */
        
        // Configuración para dataLine
        const dataLineLength = dataLine.getTotalLength();
        gsap.set(dataLine, { 
            strokeDasharray: dataLineLength, 
            strokeDashoffset: dataLineLength, 
            opacity: 1 // Hacemos visible el elemento pero el offset lo oculta visualmente
        });

        // Configuración para ringProgress
        const ringLength = ringProgress.getTotalLength();
        gsap.set(ringProgress, { 
            strokeDasharray: ringLength, 
            strokeDashoffset: ringLength
        });

        // Inicializar otros estados
        gsap.set('.data-point', { scale: 0 });
        gsap.set('#dashboard-bars rect', { transformOrigin: "bottom" });


        // Crear el Timeline principal
        const tl = gsap.timeline({
            defaults: { ease: "power2.out" },
            onComplete: () => {
                console.log("Animación de intro finalizada.");
            }
        });

        /* =========================================================================
           FASE 1: LÍNEA DE DATOS BRILLANTE (Aprox. 3.0s)
           ========================================================================= */

        tl.addLabel("phase1-start");

        // 1. Dibujar la línea de datos (2.5s) - Animamos el offset a 0
        tl.to(dataLine, { 
            strokeDashoffset: 0, 
            duration: 2.5, 
            ease: "power2.inOut" 
        }, "phase1-start");

        // 2. Revelar los puntos de datos a lo largo del dibujo (2.7s)
        tl.to(pointGroup, { opacity: 1, duration: 0.1 }, "phase1-start"); 
        tl.to('.data-point', {
            scale: 1,
            duration: 0.3,
            stagger: {
                each: 0.4, 
                from: "start"
            },
            ease: "back.out(1.7)"
        }, "phase1-start+=0.2"); 

        /* =========================================================================
           FASE 2: ENSAMBLAJE RÁPIDO DEL DASHBOARD (Aprox. 2.0s)
           ========================================================================= */

        tl.addLabel("phase2-dashboard-in", "+=0.2"); 

        // 1. Desvanecer la línea y los puntos (0.3s)
        tl.to('#phase1-group', { opacity: 0, duration: 0.3 }, "phase2-dashboard-in");

        // 2. Hacer visible el grupo del dashboard
        tl.to(dashboardGroup, { opacity: 1, duration: 0.3 }, "phase2-dashboard-in");

        // 3. Animación de Ensamblaje de Barras (ScaleY)
        tl.to('#dashboard-bars rect', {
            scaleY: 1,
            duration: 0.8,
            stagger: 0.1,
            ease: "power3.out"
        }, "phase2-dashboard-in");

        // 4. Animación de KPIs y Textos (Opacidad y Posición)
        tl.to('#dashboard-kpis, #dashboard-group text', {
            opacity: 1,
            y: 0,
            duration: 0.5,
            ease: "power2.out"
        }, "phase2-dashboard-in+=0.3");

        // 5. Animación de Anillo de Progreso (Dibujo manual con offset)
        tl.to(ringProgress, {
            strokeDashoffset: 0, // Animamos a 0
            opacity: 1,
            duration: 0.7,
            ease: "power2.out"
        }, "phase2-dashboard-in+=0.5");

        /* =========================================================================
           FASE 3: COLAPSO Y REVELACIÓN DEL LOGO (Aprox. 2.0s)
           ========================================================================= */

        tl.addLabel("phase3-logo-reveal", "+=0.5");

        // 1. Colapso del Dashboard (Scale hacia el centro, 0.7s)
        tl.to(dashboardGroup, {
            scale: 0.1,
            opacity: 0,
            duration: 0.7,
            ease: "back.in(1.7)"
        }, "phase3-logo-reveal");

        // 2. Revelación del Ícono Estilizado
        tl.to('#logo-icon', { opacity: 1, duration: 0.1 }, "phase3-logo-reveal+=0.3"); 

        // Ícono Oscuro
        tl.to(logoIconDark, {
            scale: 1,
            duration: 0.5,
            ease: "back.out(1)"
        }, "phase3-logo-reveal+=0.3");

        // Ícono Claro
        tl.to(logoIconLight, {
            scale: 1,
            duration: 0.5,
            ease: "back.out(1.2)"
        }, "phase3-logo-reveal+=0.4");

        // Punto central
        tl.to(logoIconCenter, { opacity: 1, duration: 0.2 }, "phase3-logo-reveal+=0.8");

        // 3. Desvanecimiento del Ícono para dar paso al Texto
        tl.to('#logo-icon', { opacity: 0, duration: 0.4 }, "phase3-logo-reveal+=1.4"); 

        // 4. Revelación del Texto "EL OBSERVATORIO" (Efecto Elastic)
        tl.fromTo(logoText, { opacity: 0, scale: 0.5 }, {
            opacity: 1,
            scale: 1,
            duration: 1.0, 
            ease: "elastic.out(1, 0.5)"
        }, "phase3-logo-reveal+=1.5"); 
    </script>
</body>
</html>
