<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Observatorio del Servicio Civil – Intro Lupa Apple</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:#000;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;
  }

  /* Fondo tipo Apple: oscuro + ligero glow */
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(circle at 20% 0%, #1f2937 0, transparent 45%),
      radial-gradient(circle at 80% 100%, #111827 0, transparent 55%);
    opacity:0.9;
    z-index:-1;
  }
  body::after{
    content:"";
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size:52px 52px;
    opacity:.16;
    z-index:-1;
  }

  canvas#bg{
    position:fixed;
    inset:0;
    display:block;
    z-index:1;
  }

  /* Pantalla final */
  #main{
    position:relative;
    z-index:3;
    width:100%;height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:32px 20px;
    opacity:0;pointer-events:none;
    transition:opacity 1.2s ease-in-out;
    background:radial-gradient(circle at top,#111827 0,#020308 60%);
  }
  #main.show{
    opacity:1;pointer-events:auto;
  }

  #logo-link{
    display:inline-block;
  }
  #logo-final{
    width:min(260px,60vw);
    filter:drop-shadow(0 28px 50px rgba(0,0,0,.9));
    transition:transform .35s ease, filter .35s ease;
  }
  #logo-link:hover #logo-final{
    transform:translateY(-4px) scale(1.05);
    filter:drop-shadow(0 40px 80px rgba(0,0,0,1));
  }

  #main h1{
    color:#fff;
    font-size:clamp(26px,4vw,40px);
    margin-top:18px;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  #main p{
    color:#d4d4d4;
    max-width:720px;
    margin:12px auto 0;
    font-size:clamp(15px,2.4vw,18px);
  }

  .btn-go{
    margin-top:24px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 22px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.25);
    background:
      radial-gradient(circle at 0 0,#C41B3F 0,transparent 55%);
    color:#fff;
    text-decoration:none;
    font-size:15px;
    letter-spacing:.04em;
    text-transform:uppercase;
    cursor:pointer;
    transition:
      transform .2s ease,
      box-shadow .2s ease,
      background .2s ease,
      border-color .2s ease;
  }
  .btn-go span.icon{font-size:18px;}
  .btn-go:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 32px rgba(0,0,0,.9);
    background:
      radial-gradient(circle at 0 0,#E13B61 0,transparent 60%);
    border-color:rgba(255,255,255,.45);
  }

  .fade-out{
    opacity:0;
    transition:opacity 1.1s ease-in-out;
    pointer-events:none;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- PANTALLA FINAL -->
<div id="main">
  <a id="logo-link" href="https://observatorio-servir.netlify.app/#inicio" target="_blank" rel="noopener">
    <img id="logo-final" src="logo-observatorio.png" alt="Ir al Observatorio del Servicio Civil">
  </a>
  <h1>Observatorio del Servicio Civil</h1>
  <p>
    Haz clic en el isotipo para ingresar al dashboard gerencial del Observatorio.
  </p>
  <a class="btn-go" href="https://observatorio-servir.netlify.app/#inicio" target="_blank" rel="noopener">
    <span class="icon">➜</span> Ir al Observatorio
  </a>
</div>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
  const canvas = document.getElementById("bg");
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0); // transparente para dejar ver el fondo CSS

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
  );
  camera.position.set(0, 5, 26);

  // Luces estilo estudio de producto
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
  keyLight.position.set(12, 20, 30);
  scene.add(keyLight);

  const rimLight = new THREE.DirectionalLight(0xffffff, 0.7);
  rimLight.position.set(-18, 10, -10);
  scene.add(rimLight);

  const bottomLight = new THREE.DirectionalLight(0xffffff, 0.4);
  bottomLight.position.set(0, -20, 10);
  scene.add(bottomLight);

  // Grupo de la lupa
  const magnifier = new THREE.Group();
  scene.add(magnifier);

  const metalMat = new THREE.MeshStandardMaterial({
    color:0xd0d0d0,
    metalness:0.95,
    roughness:0.18
  });

  const innerMetalMat = new THREE.MeshStandardMaterial({
    color:0x999999,
    metalness:0.9,
    roughness:0.3
  });

  // Aro de la lupa
  const ringGeo = new THREE.TorusGeometry(5, 0.5, 32, 80);
  const ringMesh = new THREE.Mesh(ringGeo, metalMat);
  ringMesh.rotation.x = Math.PI / 2;
  magnifier.add(ringMesh);

  // Vidrio
  const glassGeo = new THREE.CircleGeometry(4.4, 64);
  const glassMat = new THREE.MeshStandardMaterial({
    color:0xffffff,
    transparent:true,
    opacity:0.12,
    metalness:0.1,
    roughness:0.1
  });
  const glassMesh = new THREE.Mesh(glassGeo, glassMat);
  glassMesh.position.z = 0.05;
  magnifier.add(glassMesh);

  // Bisel interior leve
  const innerRingGeo = new THREE.TorusGeometry(4.3, 0.12, 32, 80);
  const innerRing = new THREE.Mesh(innerRingGeo, innerMetalMat);
  innerRing.rotation.x = Math.PI / 2;
  innerRing.position.z = 0.06;
  magnifier.add(innerRing);

  // Mango
  const handleGeo = new THREE.CylinderGeometry(0.45, 0.45, 8, 32);
  const handle = new THREE.Mesh(handleGeo, metalMat);
  handle.position.set(5.7, -5.4, 0);
  handle.rotation.z = Math.PI / 3.5;
  magnifier.add(handle);

  // Pequeño extremo del mango
  const knobGeo = new THREE.SphereGeometry(0.6, 32, 32);
  const knob = new THREE.Mesh(knobGeo, innerMetalMat);
  knob.position.set(5.7, -9.0, 0);
  magnifier.add(knob);

  // Grupo del logo dentro del lente
  const logoGroup = new THREE.Group();
  logoGroup.position.set(0, 0, 0.09);
  magnifier.add(logoGroup);

  const texLoader = new THREE.TextureLoader();
  texLoader.load("logo-observatorio.png", (tex)=>{
    const logoPlaneGeo = new THREE.PlaneGeometry(5.8,5.8);
    const logoPlaneMat = new THREE.MeshStandardMaterial({
      map:tex,
      transparent:true,
      metalness:0.0,
      roughness:0.8
    });
    const logoPlane = new THREE.Mesh(logoPlaneGeo, logoPlaneMat);
    logoGroup.add(logoPlane);
  });

  // Posición inicial de la lupa (más lejos y girada)
  magnifier.position.set(0, 0, 0);
  magnifier.rotation.set(0.6, -0.6, 0.25);
  magnifier.scale.set(0.2, 0.2, 0.2);

  // Partículas suaves alrededor (como polvos de luz/datos)
  const particleGeo = new THREE.BufferGeometry();
  const particleCount = 600;
  const positions = new Float32Array(particleCount * 3);
  for(let i=0;i<particleCount;i++){
    positions[i*3+0] = (Math.random()-0.5)*40;
    positions[i*3+1] = (Math.random()-0.5)*22;
    positions[i*3+2] = -10 - Math.random()*40;
  }
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const particleMat = new THREE.PointsMaterial({
    color:0xffffff,
    size:0.16,
    transparent:true,
    opacity:0.7
  });
  const particles = new THREE.Points(particleGeo, particleMat);
  scene.add(particles);

  let start = performance.now();
  let finished = false;

  function animate(now){
    requestAnimationFrame(animate);
    const t = (now - start) / 1000; // segundos

    // Rotación sutil permanente de la lupa
    magnifier.rotation.y += 0.0025;
    magnifier.rotation.x += 0.0009;

    // Movimiento suave de partículas (como brillos/datos alrededor)
    const pPos = particles.geometry.attributes.position;
    for(let i=0;i<particleCount;i++){
      let y = pPos.getY(i);
      y += 0.02;
      if(y > 12){
        y = -12 - Math.random()*8;
      }
      pPos.setY(i,y);
    }
    pPos.needsUpdate = true;

    // Fase 1: la lupa entra (0–2.5s)
    if(t < 2.5){
      const k = Math.min(1, t/2.5);
      const s = 0.2 + k*0.8;
      magnifier.scale.set(s,s,s);
      camera.position.z = 26 - k*3; // se acerca poquito
    }

    // Fase 2: pausa elegante (2.5–4.5s)
    if(t >= 2.5 && t < 4.5){
      const k = (t-2.5)/2;
      camera.position.y = 5 - k*2; // baja un poco
    }

    // Fase 3: zoom fuerte hacia el lente + enderezar
    if(t >= 4.5 && t < 7){
      const k = (t-4.5)/2.5; // 0..1
      camera.position.z = 23 - k*12;   // 23 -> 11
      camera.position.y = 3 - k*3;     // 3 -> 0
      // enderezar la lupa para quedar frontal
      magnifier.rotation.x = 0.6 - k*0.6;
      magnifier.rotation.y = -0.6 + k*0.6;
      magnifier.rotation.z = 0.25 - k*0.25;
    }

    // Fase 4: final, lente casi pantalla (logo llena vista)
    if(t >= 7 && !finished){
      finished = true;
      endIntro();
    }

    renderer.render(scene,camera);
  }
  requestAnimationFrame(animate);

  function endIntro(){
    const canvasEl = document.getElementById("bg");
    const main = document.getElementById("main");
    setTimeout(()=>{
      canvasEl.classList.add("fade-out");
      main.classList.add("show");
      document.body.style.overflow = "auto";
    }, 900);
  }

  window.addEventListener("resize", ()=>{
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w,h);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  });
</script>

</body>
</html>
